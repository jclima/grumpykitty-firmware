name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio
      - run: pio run -e esp32s3box
      - run: sh tools/host_tests/run.sh
      - name: Merge images and generate manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 tools/release/merge_bin.py --build-dir .pio/build/esp32s3box --version "$VERSION" --out-dir dist
          cd dist && sha256sum ./*.bin manifest.json > SHA256SUMS && cat SHA256SUMS
      - name: Assemble Pages site
        run: |
          mkdir -p _site/flash
          cp -R docs/flash/. _site/flash/
          rm -f _site/flash/manifest.template.json
          cp dist/manifest.json dist/grumpykitty-*-merged.bin _site/flash/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=flash/">
          <title>GrumpyKitty</title>
          </head>
          <body>
          <p><a href="flash/">GrumpyKitty web flasher</a></p>
          </body>
          </html>
          HTML
          touch _site/.nojekyll
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "GrumpyKitty $GITHUB_REF_NAME" --generate-notes \
            dist/grumpykitty-*-merged.bin dist/grumpykitty-*-firmware.bin dist/SHA256SUMS dist/manifest.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
