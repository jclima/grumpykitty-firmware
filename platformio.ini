; ══════════════════════════════════════════════════════
; GrumpyKitty  ·  ESP32-S3-WROOM-1-N16R8
;  16 MB Flash (QIO)  ·  8 MB OPI PSRAM  ·  LVGL 8.3
; ══════════════════════════════════════════════════════

[env:esp32s3box]
platform               = espressif32@6.0.1
board                  = esp32s3box
framework              = arduino

; ── Flash & Partition ────────────────────────────────
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

; ── Serial Monitor ───────────────────────────────────
monitor_speed          = 115200

; ── Upload ───────────────────────────────────────────
upload_protocol        = esptool
upload_speed           = 921600

; ── Assets ───────────────────────────────────────────
extra_scripts =
    pre:tools/gk_version.py          ; VERSION → -DGK_VERSION
    pre:tools/embed_gif.py           ; GIF → .incbin, no C array needed

; ── Build ────────────────────────────────────────────
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1

build_flags =
    -std=gnu++17
    -I${PROJECT_SRC_DIR}/ui
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0             
    -DARDUINO_USB_CDC_ON_BOOT=1       
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Wl,-zmuldefs                     
    -DCORE_DEBUG_LEVEL=3              
    -O2

; Personal Lua apps replace the old built-in Dino/Boat Dash executables.
; Keep their source for parity, but never link those implementations or icons.
build_src_filter =
    +<*>
    -<app/app_01/dino.cpp>
    -<app/app_01/FixedPointsArduino/**>
    -<app/app_01/include/**>
    -<app/app_01/src/**>
    -<app/app_14/boat_dash.cpp>
    -<ui/images/ui_img_dino_png.c>
    -<ui/images/ui_img_boatdash_png.c>

